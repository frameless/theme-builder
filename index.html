<!doctype html>
<html lang="en" class="utrecht-root basis-theme">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Theme Builder</title>

  <!-- Google Fonts-->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Fira Sans -->
  <!-- https://fonts.google.com/share?selection.family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700|Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900|Inclusive+Sans:ital,wght@0,300..700;1,300..700|Lexend:wght@100..900|Noto+Sans:ital,wght@0,100..900;1,100..900|Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800|Public+Sans:ital,wght@0,100..900;1,100..900|Source+Sans+3:ital,wght@0,200..900;1,200..900|Varta:wght@300..700|Work+Sans:ital,wght@0,100..900;1,100..900 -->
  <link
    href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Inclusive+Sans:ital,wght@0,300..700;1,300..700&family=Lexend:wght@100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Public+Sans:ital,wght@0,100..900;1,100..900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&family=Varta:wght@300..700&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&display=swap" rel="stylesheet" />
</head>

<body class="utrecht-body">
  <div id="app" class="utrecht-page-layout utrecht-page-layout--snap"></div>
  <script type="module" src="/src/main.ts"></script>

  <template id="font-panel-template">
    <style>
      :host {
        display: grid;
        grid-template-columns: 3fr 2fr;
        gap: .5rem;
      }

      .sr-only {
        display: none;
      }

      font-panel-group:has(select) {
        & label {
          /* TODO: do this accessibly */
          display: none;
        }
      }

      font-panel-group {
        display: flex;
        gap: 1ch;
        align-items: center;
      }

      font-panel-misc {
        display: flex;
        gap: 1rem;
      }

      select {
        width: 100%;
        padding-block: .25lh;
        padding-inline: .25ch;
      }

      font-panel-faux-label {
        color: ButtonText;
      }

      example-font-preset-input {
        width: 100%;
      }
    </style>
    <font-panel-group token="font-family">
      <label>Family</label>
      <example-font-preset-input token="font-family" prop="family"></example-font-preset-input>
    </font-panel-group>
    <font-panel-group token="font-weight">
      <label>Weight</label>
      <select prop="weight" token="font-weight">
        <option value="100">Thin (hairline)</option>
        <option value="200">Extra light</option>
        <option value="300">Light</option>
        <option value="400">Normal</option>
        <option value="500">Medium</option>
        <option value="600">Semi Bold</option>
        <option value="700" selected>Bold</option>
        <option value="800">Extra Bold</option>
        <option value="900">Black</option>
      </select>
    </font-panel-group>
    <font-panel-group token="font-size">
      <label>Size</label>
      <font-panel-faux-label style="white-space: nowrap; font-weight: 900; font-size: 1.2em; line-height: 1;"><small
          style="font-size:.7em">T</small>T</font-panel-faux-label>
      <select prop="size" token="font-size">
        <option>1rem</option>
        <option>2rem</option>
      </select>
    </font-panel-group>
    <font-panel-group token="line-height">
      <label>Line height</label>
      <font-panel-faux-label
        style="white-space: nowrap; font-weight: 700; line-height: 1; letter-spacing: -.2em; line-height: 0;">
        <sub>A</sub>
        <sup>A</sup>
      </font-panel-faux-label>
      <select prop="leading" token="line-height">
        <option>0</option>
        <option>0.75</option>
        <option selected>1</option>
        <option>1.5</option>
        <option>2</option>
      </select>
    </font-panel-group>
    <font-panel-misc>
      <font-panel-group token="font-style">
        <label id="italic-label" class="sr-only">Italic?</label>
        <toggle-button aria-labelledby="italic-label" token="font-style" prop="italic">
          <span class="sr-only">Italic</span>
          <span aria-hidden="true" style="font-size: 1.2em; font-style: italic;">T</span>
        </toggle-button>
      </font-panel-group>
      <font-panel-group token="color">
        <label>Color</label>
        <input type="color" name="color">
      </font-panel-group>
    </font-panel-misc>
  </template>
</body>

</html>
